	<script>
document.addEventListener('DOMContentLoaded', function() {
    const images = document.querySelectorAll('img');
    images.forEach(image => {
        image.setAttribute('loading', 'lazy');
    });

    const metrikaId = 92211638;
    const sentGoals = new Set();

    function sendGoal(goalName, context = 'unknown') {
        const timestamp = Math.floor(Date.now() / 5000);
        const goalKey = `${goalName}_${timestamp}`;

        if (sentGoals.has(goalKey)) {
            console.log(`⚠️ Цель "${goalName}" уже отправлена (дубликат заблокирован, контекст: ${context})`);
            return false;
        }

        if (typeof ym === 'function') {
            ym(metrikaId, 'reachGoal', goalName);
            sentGoals.add(goalKey);
            console.log(`✅ Цель отправлена: "${goalName}" (контекст: ${context})`);
            setTimeout(() => sentGoals.delete(goalKey), 10000);
            return true;
        } else {
            console.error('❌ Яндекс.Метрика не загружена');
            return false;
        }
    }

    document.body.addEventListener('click', function(event) {
        const target = event.target.closest('[data-goal]');

        if (target) {
            const goalName = target.dataset.goal;

            if (!goalName || goalName === '0' || goalName === 'null') {
                console.log('⏭️ Пропускаем элемент с пустой целью');
                return;
            }

            const isSubmitButton = target.getAttribute('type') === 'submit';
            const isLink = target.tagName === 'A';
            const isExternalLink = isLink && (target.getAttribute('target') === '_blank' ||
                                             target.href.includes('http') && !target.href.includes(window.location.hostname));

            if (!isSubmitButton) {
                if (isLink) {
                    event.preventDefault();
                    sendGoal(goalName, isExternalLink ? 'Click (внешняя ссылка)' : 'Click (ссылка)');
                    setTimeout(() => {
                        if (target.getAttribute('target') === '_blank') {
                            window.open(target.href, '_blank');
                        } else {
                            window.location.href = target.href;
                        }
                    }, 300);
                } else {
                    sendGoal(goalName, 'Click (кнопка)');
                }
            } else {
                console.log(`⏭️ Пропускаем клик по кнопке формы "${goalName}" (цель отправится после успешной отправки)`);
            }
        }
    });

    let lastSubmittedForm = null;
    let lastSubmitTime = 0;
    let lastFormId = null;

    document.addEventListener('submit', function(event) {
        const form = event.target;
        const formId = form.id || form.getAttribute('data-s3-anketa-id');

        if (lastFormId === formId && (Date.now() - lastSubmitTime) < 2000) {
            console.log('⚠️ Дублирующаяся отправка формы заблокирована', formId);
            event.preventDefault();
            return false;
        }

        lastSubmittedForm = form;
        lastSubmitTime = Date.now();
        lastFormId = formId;

        console.log('📋 Форма отправляется (стандартное событие submit)', {
            form: form,
            formId: formId,
            anketaId: form.getAttribute('data-s3-anketa-id')
        });

        const goalButton = form.querySelector('button[data-goal][type="submit"]');
        if (goalButton) {
            const goalName = goalButton.dataset.goal;
            console.log(`🎯 Найдена цель в кнопке: "${goalName}"`);
        }
    }, true);

    const originalXHROpen = XMLHttpRequest.prototype.open;
    const originalXHRSend = XMLHttpRequest.prototype.send;

    XMLHttpRequest.prototype.open = function(method, url) {
        this._url = url;
        this._method = method;
        return originalXHROpen.apply(this, arguments);
    };

    XMLHttpRequest.prototype.send = function(data) {
        this.addEventListener('load', function() {
            if (this.status >= 200 && this.status < 300) {
                console.log('📡 AJAX запрос успешен:', {
                    url: this._url,
                    method: this._method,
                    status: this.status,
                    response: this.responseText.substring(0, 200)
                });

                if (this._method === 'POST' && this._url && this._url.includes('form')) {
                    console.log('📮 Обнаружена успешная отправка формы через AJAX');

                    const urlFormId = this._url.match(/form_id[=\]](\d+)/)?.[1];
                    console.log('🆔 Form ID из AJAX запроса:', urlFormId);

                    if (lastSubmittedForm && (Date.now() - lastSubmitTime) < 5000) {
                        const submittedFormId = lastSubmittedForm.getAttribute('data-s3-anketa-id');

                        if (!urlFormId || urlFormId === submittedFormId) {
                            const goalButton = lastSubmittedForm.querySelector('button[data-goal][type="submit"]');
                            if (goalButton) {
                                const goalName = goalButton.dataset.goal;
                                sendGoal(goalName, `AJAX success (form_id: ${urlFormId || submittedFormId})`);
                            }
                            lastSubmittedForm = null;
                            lastFormId = null;
                        } else {
                            console.warn(`⚠️ Form ID не совпадает: AJAX=${urlFormId}, Submitted=${submittedFormId}`);
                        }
                    } else {
                        console.warn('⚠️ Не найдена последняя отправленная форма или прошло слишком много времени');
                    }
                }
            }
        });
        return originalXHRSend.apply(this, arguments);
    };

    const originalFetch = window.fetch;
    window.fetch = function() {
        return originalFetch.apply(this, arguments).then(response => {
            if (response.ok && response.url.includes('form')) {
                console.log('📡 Fetch запрос успешен:', response.url);

                if (lastSubmittedForm && (Date.now() - lastSubmitTime) < 3000) {
                    const goalButton = lastSubmittedForm.querySelector('button[data-goal][type="submit"]');
                    if (goalButton) {
                        const goalName = goalButton.dataset.goal;
                        sendGoal(goalName, 'Fetch success');
                    }
                    lastSubmittedForm = null;
                } else {
                    console.warn('⚠️ Не найдена последняя отправленная форма или прошло слишком много времени');
                }
            }
            return response;
        });
    };

    const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
                if (node.nodeType === 1) {
                    const successTexts = ['успешно', 'отправлен', 'благодар', 'спасибо', 'thank', 'success'];
                    const nodeText = node.textContent.toLowerCase();

                    if (successTexts.some(text => nodeText.includes(text))) {
                        console.log('✨ Обнаружено сообщение об успехе:', nodeText.substring(0, 100));

                        let form = node.closest('form');
                        if (!form) {
                            const forms = document.querySelectorAll('form');
                            if (forms.length > 0) form = forms[0];
                        }

                        if (form) {
                            const goalButton = form.querySelector('button[data-goal][type="submit"]');
                            if (goalButton) {
                                const goalName = goalButton.dataset.goal;
                                sendGoal(goalName, 'Success message detected');
                            }
                        }
                    }
                }
            });
        });
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true
    });

    const eventsToLog = ['formSuccess', 'formSubmit', 'formComplete', 'submitSuccess',
                        'taptopFormSuccess', 'taptop:form:success', 'form:success'];

    eventsToLog.forEach(eventName => {
        document.addEventListener(eventName, function(event) {
            console.log(`🎪 Событие обнаружено: "${eventName}"`, event);

            const form = event.detail?.form || event.target;
            if (form && form.tagName === 'FORM') {
                const goalButton = form.querySelector('button[data-goal][type="submit"]');
                if (goalButton) {
                    const goalName = goalButton.dataset.goal;
                    sendGoal(goalName, `Custom event: ${eventName}`);
                }
            }
        });
    });

    console.log('🚀 Система отслеживания целей Яндекс.Метрики запущена');
    console.log('📊 Для отладки откройте консоль разработчика');

});
</script>
