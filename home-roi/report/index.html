<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ИТМен — персональный отчёт ROI (макет)</title>
  <style>
    @font-face {
      font-family: "Nekst Regular Web";
      font-weight: 400;
      font-style: normal;
      src: url("https://itman.ru/t/images/mosaic/fonts/Nekst%20Regular%20Web-400-normal-0.ttf") format("truetype");
    }
    @font-face {
      font-family: "Nekst Medium Web";
      font-weight: 500;
      font-style: normal;
      src: url("https://itman.ru/t/images/mosaic/fonts/Nekst%20Medium%20Web-500-normal-0.ttf") format("truetype");
    }
    @font-face {
      font-family: "Nekst SemiBold";
      font-weight: 600;
      font-style: normal;
      src: url("https://itman.ru/t/images/mosaic/fonts/Nekst%20SemiBold-600-normal-0.ttf") format("truetype");
    }
    @font-face {
      font-family: "Nekst";
      font-weight: 400;
      font-style: normal;
      src: url("https://itman.ru/t/images/mosaic/fonts/Nekst-400-normal-0.woff") format("woff");
    }
    @font-face {
      font-family: "Nekst";
      font-weight: 600;
      font-style: normal;
      src: url("https://itman.ru/t/images/mosaic/fonts/Nekst-600-normal-0.woff") format("woff");
    }
    :root {
      --ink: #141414;
      --muted: #5c5c5c;
      --line: #e6e6e6;
      --paper: #f7f5f2;
      --card: #ffffff;
      --red: #e30613;
      --red-soft: #fde8ea;
      --ok: #1a7a4c;
      --font: "Nekst", "Nekst Regular Web", Arial, Helvetica, sans-serif;
      --display: "Nekst Medium Web", "Nekst SemiBold", "Nekst", Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 400px at 10% -10%, #ffe5e7 0%, transparent 55%),
        linear-gradient(180deg, #faf8f5 0%, var(--paper) 40%, #efece7 100%);
      min-height: 100vh;
    }
    .studio {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }
    .panel {
      position: sticky;
      top: 16px;
      align-self: start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 20px;
      box-shadow: 0 10px 30px rgba(20, 20, 20, 0.04);
    }
    .panel h1 {
      font-family: var(--display);
      font-size: 22px;
      line-height: 1.2;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .panel .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 16px;
    }
    .panel label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin: 12px 0 6px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .panel input, .panel select {
      width: 100%;
      height: 44px;
      border: 1px solid #d8d4ce;
      border-radius: 10px;
      padding: 0 12px;
      font: inherit;
      background: #fff;
    }
    .panel .row-btns {
      display: grid;
      gap: 8px;
      margin-top: 16px;
    }
    .btn {
      appearance: none;
      border: 0;
      border-radius: 12px;
      min-height: 46px;
      padding: 0 16px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid #ccc; color: var(--ink); }
    .btn:hover { filter: brightness(0.97); }

    .report-wrap { min-width: 0; }
    .report {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 18px 50px rgba(20, 20, 20, 0.07);
      padding: 0;
      overflow: hidden;
    }

    .page {
      padding: 48px 52px;
      border-bottom: 1px dashed var(--line);
    }
    .page:last-child { border-bottom: 0; }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 28px;
    }
    .brand {
      display: block;
      line-height: 0;
    }
    .brand img {
      height: 36px;
      width: auto;
      display: block;
    }
    .meta {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }
    .kicker {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    h2.report-title {
      font-family: var(--display);
      font-size: 34px;
      line-height: 1.2;
      margin: 0 0 14px;
      max-width: none;
      font-weight: 600;
    }
    .lead {
      font-size: 15px;
      color: var(--muted);
      max-width: none;
      line-height: 1.55;
      margin: 0 0 28px;
    }

    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 28px;
    }
    .metric {
      background: #faf8f5;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 16px 18px;
    }
    .metric.accent {
      background: var(--red-soft);
      border-color: #f3c4c8;
    }
    .metric .l {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
      line-height: 1.3;
    }
    .metric .v {
      font-size: 26px;
      font-weight: 500;
      font-family: var(--display);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .doc-block { margin: 28px 0; }
    .doc-block:first-of-type { margin-top: 0; }
    .key-lines {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }
    .key-lines li {
      font-size: 16px;
      line-height: 1.45;
    }
    .key-lines strong {
      font-family: var(--display);
      font-weight: 500;
    }
    .data-lines {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 8px;
      font-size: 15px;
      line-height: 1.5;
    }
    .bullets {
      margin: 14px 0 18px;
      padding-left: 20px;
      font-size: 15px;
      line-height: 1.55;
    }
    .bullets li { margin-bottom: 8px; }
    .aud-block {
      margin-bottom: 22px;
    }
    .aud-block h4 {
      margin: 0 0 10px;
      font-family: var(--display);
      font-size: 17px;
      font-weight: 500;
    }
    .aud-block ul {
      margin: 0;
      padding-left: 20px;
      font-size: 15px;
      line-height: 1.55;
    }
    .aud-block li { margin-bottom: 8px; }
    .priority-list {
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: pri;
      display: grid;
      gap: 16px;
    }
    .priority-list li {
      counter-increment: pri;
      font-size: 15px;
      line-height: 1.55;
      padding-left: 32px;
      position: relative;
    }
    .priority-list li::before {
      content: counter(pri) ".";
      position: absolute;
      left: 0;
      top: 0;
      font-family: var(--display);
      font-weight: 500;
      color: var(--red);
    }
    .priority-list strong {
      font-family: var(--display);
      font-weight: 500;
    }
    .steps li { margin-bottom: 10px; }
    .cta-box {
      margin-top: 28px;
      padding: 22px 24px;
      border-radius: 16px;
      background: linear-gradient(160deg, #fff5f6, #ffffff);
      border: 1px solid rgba(227, 6, 19, 0.22);
    }
    .cta-box p {
      margin: 0 0 12px;
      font-size: 15px;
      line-height: 1.55;
    }
    .cta-box .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
      font-family: var(--display);
      font-weight: 500;
      text-decoration: none;
      margin-top: 8px;
    }
    .footnote {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      font-style: italic;
    }

    .inputs-box {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px 18px;
      background: #fff;
    }
    .inputs-box h3 {
      margin: 0 0 12px;
      font-size: 14px;
    }
    .inputs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      font-size: 13px;
    }
    .inputs-grid div {
      background: #faf8f5;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .inputs-grid b { display: block; font-size: 16px; margin-top: 4px; }

    h3.sec {
      font-family: var(--display);
      font-size: 22px;
      margin: 0 0 8px;
      font-weight: 600;
    }
    .sec-lead {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 18px;
      line-height: 1.55;
      max-width: none;
    }

    .bars { display: grid; gap: 12px; margin-bottom: 18px; }
    .bar-row { display: grid; grid-template-columns: 140px 1fr 90px; gap: 10px; align-items: center; font-size: 13px; }
    .bar-track {
      height: 10px;
      background: #eee;
      border-radius: 99px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #c40510, var(--red));
      border-radius: 99px;
    }
    .bar-row strong { text-align: right; }

    .assumptions {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      background: #faf8f5;
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--line);
    }

    .audience {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .aud-card {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 14px 16px;
      background: #fff;
    }
    .aud-card h4 {
      margin: 0 0 10px;
      font-size: 13px;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .aud-card ul {
      margin: 0;
      padding: 0 0 0 16px;
      font-size: 12.5px;
      line-height: 1.45;
      color: #333;
    }
    .aud-card li { margin-bottom: 6px; }

    .recs { display: grid; gap: 10px; }
    .rec {
      border-left: 3px solid var(--red);
      padding: 10px 12px 12px 14px;
      background: #faf8f5;
      border-radius: 0 12px 12px 0;
    }
    .rec strong { display: block; margin-bottom: 4px; font-size: 14px; }
    .rec p { margin: 0; font-size: 13px; color: #333; line-height: 1.45; }

    .steps {
      counter-reset: step;
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }
    .steps li {
      counter-increment: step;
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: start;
      font-size: 14px;
      line-height: 1.45;
    }
    .steps li::before {
      content: counter(step);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
    }

    .disclaimer {
      margin-top: 24px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    @media (max-width: 960px) {
      .studio { grid-template-columns: 1fr; }
      .panel { position: static; }
      .hero-metrics, .audience, .inputs-grid { grid-template-columns: 1fr; }
      .page { padding: 28px 20px; }
      .bar-row { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: #fff; }
      .studio { display: block; max-width: none; padding: 0; }
      .panel { display: none !important; }
      .report {
        border: 0;
        box-shadow: none;
        border-radius: 0;
      }
      .page {
        border: 0;
        padding: 18mm 16mm;
        break-after: page;
      }
      .page:last-child { break-after: auto; }
      a { color: inherit; text-decoration: none; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <aside class="panel" aria-label="Параметры отчёта">
      <h1>Макет PDF-отчёта</h1>
      <p class="hint">Те же ответы, что в лид-магните. Меняйте поля — отчёт пересоберётся. «Скачать PDF» = печать в файл.</p>

      <label for="company">Компания (опционально)</label>
      <input id="company" type="text" placeholder="Например, ООО «Пример»" value="Пример для руководства" />

      <label for="endpoints">Рабочие места</label>
      <select id="endpoints">
        <option value="100">до 100</option>
        <option value="300">100–500</option>
        <option value="750">500–1000</option>
        <option value="2500" selected>1000–5000</option>
        <option value="7500">5000+</option>
      </select>

      <label for="itStaff">Сотрудники ИТ</label>
      <input id="itStaff" type="number" min="1" max="500" value="70" />

      <label for="budget">Годовой бюджет на ПО, ₽</label>
      <input id="budget" type="text" inputmode="numeric" value="12 000 000" />

      <div class="row-btns">
        <button type="button" class="btn btn-primary" id="btnPrint">Скачать PDF</button>
        <button type="button" class="btn btn-ghost" id="btnCopyLink">Ссылка с параметрами</button>
      </div>
    </aside>

    <div class="report-wrap">
      <article class="report" id="report" aria-label="Персональный отчёт">
        <!-- filled by JS -->
      </article>
    </div>
  </div>

  <script src="./report-engine.js"></script>
  <script>
    (function () {
      function parseBudget(raw) {
        var n = Number(String(raw || "").replace(/[^\d]/g, ""));
        return isFinite(n) ? n : 0;
      }

      function qs() {
        var p = new URLSearchParams(location.search);
        return {
          company: p.get("company") || "",
          endpoints: p.get("wp") || p.get("endpoints") || "",
          itStaff: p.get("it") || p.get("itStaff") || "",
          budget: p.get("budget") || "",
        };
      }

      function applyQs() {
        var q = qs();
        if (q.company) document.getElementById("company").value = q.company;
        if (q.endpoints) document.getElementById("endpoints").value = q.endpoints;
        if (q.itStaff) document.getElementById("itStaff").value = q.itStaff;
        if (q.budget) {
          var b = parseBudget(q.budget);
          document.getElementById("budget").value = b
            ? b.toLocaleString("ru-RU").replace(/\u00a0/g, " ")
            : q.budget;
        }
      }

      function readInputs() {
        return {
          company: document.getElementById("company").value.trim(),
          endpoints: Number(document.getElementById("endpoints").value || 0),
          itStaff: Number(document.getElementById("itStaff").value || 0),
          budget: parseBudget(document.getElementById("budget").value),
        };
      }

      function li(list) {
        return list.map(function (t) { return "<li>" + escapeHtml(t) + "</li>"; }).join("");
      }

      function render() {
        var inp = readInputs();
        var model = ItmenRoiReport.buildReportModel(inp, { company: inp.company });
        var c = model.calc;
        var n = model.narrative;
        var f = c.fmt;
        var when = model.generatedAt.toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        var companyTitle = inp.company ? escapeHtml(inp.company) : "Компания";

        var html = "";
        html += '<section class="page">';
        html += '<div class="brand-row"><a class="brand" href="https://itman.ru/" target="_blank" rel="noopener"><img src="assets/brand.svg" alt="Инферит ИТМен" width="200" height="36" /></a>';
        html += '<div class="meta">Персональный экономический отчёт<br>' + when + "<br>Конфиденциально</div></div>";
        html += '<h2 class="report-title">Обоснование экономического эффекта для ' + companyTitle + "</h2>";
        html += '<p class="lead">Расчёт экономии и окупаемости «Инферит ИТМен» и обоснование внедрения для руководства, финансов и ИБ на базе ваших данных.</p>';

        html += '<div class="doc-block"><h3 class="sec">Что получит компания</h3>';
        html += '<ul class="key-lines">';
        html += "<li><strong>Экономия в год:</strong> " + f.save + "</li>";
        html += "<li><strong>ROI за первый год:</strong> " + f.roi + "</li>";
        html += "<li><strong>Окупается за:</strong> " + f.pay + "</li>";
        html += "</ul></div>";

        html += '<div class="doc-block"><h3 class="sec">Ваши данные</h3>';
        html += '<ul class="data-lines">';
        html += "<li>Рабочие места: <strong>" + c.inputs.endpoints.toLocaleString("ru-RU") + "</strong></li>";
        html += "<li>Сотрудники ИТ: <strong>" + c.inputs.itStaff + "</strong></li>";
        html += "<li>Бюджет на ПО в год: <strong>" + f.budget + "</strong></li>";
        html += "</ul>";
        html += '<p class="sec-lead" style="margin-top:14px;margin-bottom:0">Стоимость Инферит ИТМен по этим данным: около <strong>' + f.costFull + "</strong> в год (" + c.assumptions.pricePerEndpoint.toLocaleString("ru-RU") + " ₽ за рабочее место).</p>";
        html += "</div></section>";

        html += '<section class="page">';
        html += '<div class="doc-block"><h3 class="sec">Где экономия</h3>';
        html += '<p class="sec-lead">' + escapeHtml(n.savingsIntro) + "</p>";
        html += '<ul class="bullets">';
        n.savingsBullets.forEach(function (line) {
          html += "<li>" + escapeHtml(line) + "</li>";
        });
        html += "</ul>";
        html += '<p class="sec-lead">' + escapeHtml(n.assumptionsNote) + "</p>";
        html += "</div></section>";

        html += '<section class="page">';
        html += '<div class="doc-block"><h3 class="sec">Обоснование внедрения</h3>';
        html += '<div class="aud-block"><h4>Для руководства</h4><ul>' + li(n.forExec) + "</ul></div>";
        html += '<div class="aud-block"><h4>Для финансистов</h4><ul>' + li(n.forFinance) + "</ul></div>";
        html += '<div class="aud-block"><h4>Для ИБ и комплаенса</h4><ul>' + li(n.forSecurity) + "</ul></div>";
        html += "</div></section>";

        html += '<section class="page">';
        html += '<div class="doc-block"><h3 class="sec">Что сделать в первую очередь</h3>';
        html += '<ol class="priority-list">';
        n.recommendations.forEach(function (r) {
          html += "<li><strong>" + escapeHtml(r.title) + ".</strong> " + escapeHtml(r.text) + "</li>";
        });
        html += "</ol></div>";

        html += '<div class="doc-block"><h3 class="sec">Что делать дальше?</h3>';
        html += '<ol class="steps">';
        n.nextSteps.forEach(function (s) {
          html += "<li>" + escapeHtml(s) + "</li>";
        });
        html += "</ol></div>";

        html += '<div class="cta-box">';
        html += "<p><strong>Хотите проверить «Инферит ИТМен» на практике? Дарим сертификат на лицензии ИТМен −30%.</strong></p>";
        html += "<p>Этот расчёт построен на средних показателях. Реальные цифры зависят от вашей инфраструктуры, структуры лицензий и текущего состояния учёта. За 20 минут созвона наш эксперт посмотрит на ваш контур и уточнит расчёт, а заодно подготовит аргументы под вашу презентацию для руководства.</p>";
        html += '<a class="cta-btn" href="https://itman.ru/" target="_blank" rel="noopener">Записаться на созвон с экспертом</a>';
        html += "</div>";

        html += '<p class="footnote">Отчёт носит оценочный характер и не является офертой. Реальный эффект зависит от текущего состояния учёта активов, структуры лицензий и периметра пилота. Подробнее о продукте на <a href="https://itman.ru" target="_blank" rel="noopener">itman.ru</a>.</p>';
        html += "</section>";

        document.getElementById("report").innerHTML = html;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function bind() {
        ["company", "endpoints", "itStaff", "budget"].forEach(function (id) {
          document.getElementById(id).addEventListener("input", render);
          document.getElementById(id).addEventListener("change", render);
        });
        document.getElementById("btnPrint").addEventListener("click", function () {
          window.print();
        });
        document.getElementById("btnCopyLink").addEventListener("click", function () {
          var inp = readInputs();
          var u = new URL(location.href);
          u.searchParams.set("company", inp.company);
          u.searchParams.set("wp", String(inp.endpoints));
          u.searchParams.set("it", String(inp.itStaff));
          u.searchParams.set("budget", String(inp.budget));
          history.replaceState(null, "", u.toString());
          navigator.clipboard.writeText(u.toString()).then(
            function () { alert("Ссылка скопирована — откроется тот же отчёт"); },
            function () { prompt("Скопируйте ссылку:", u.toString()); }
          );
        });
      }

      applyQs();
      bind();
      render();
    })();
  </script>
</body>
</html>
