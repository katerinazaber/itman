<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>ИТМен — отчёт ROI + чек-лист инфраструктуры</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #141414;
      --muted: #5c5c5c;
      --line: #e6e6e6;
      --paper: #f7f5f2;
      --card: #ffffff;
      --red: #e30613;
      --red-soft: #fde8ea;
      --font: "Manrope", sans-serif;
      --display: "Source Serif 4", Georgia, serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 400px at 10% -10%, #ffe5e7 0%, transparent 55%),
        linear-gradient(180deg, #faf8f5 0%, var(--paper) 40%, #efece7 100%);
      min-height: 100vh;
    }
    .studio {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }
    .panel {
      position: sticky;
      top: 16px;
      align-self: start;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      box-shadow: 0 10px 30px rgba(20, 20, 20, 0.04);
    }
    .panel h1 {
      font-family: var(--display);
      font-size: 20px;
      margin: 0 0 6px;
      font-weight: 600;
    }
    .panel .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      margin: 0 0 14px;
    }
    .panel label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin: 10px 0 5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .panel input, .panel select {
      width: 100%;
      height: 42px;
      border: 1px solid #d8d4ce;
      border-radius: 10px;
      padding: 0 12px;
      font: inherit;
      background: #fff;
    }
    .row-btns { display: grid; gap: 8px; margin-top: 16px; }
    .btn {
      appearance: none; border: 0; border-radius: 12px; min-height: 46px;
      padding: 0 16px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .btn-primary { background: var(--red); color: #fff; }
    .btn-ghost { background: transparent; border: 1px solid #ccc; color: var(--ink); }

    .report {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 4px;
      box-shadow: 0 18px 50px rgba(20, 20, 20, 0.07);
    }
    .page { padding: 40px 44px; border-bottom: 1px dashed var(--line); }
    .page:last-child { border-bottom: 0; }
    .brand-row {
      display: flex; justify-content: space-between; gap: 16px; margin-bottom: 22px;
    }
    .brand { font-weight: 700; font-size: 14px; }
    .brand span { color: var(--red); }
    .meta { text-align: right; font-size: 12px; color: var(--muted); line-height: 1.45; }
    .kicker {
      display: inline-block; font-size: 12px; font-weight: 700; color: var(--red);
      text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
    }
    h2.report-title {
      font-family: var(--display); font-size: 30px; line-height: 1.15;
      margin: 0 0 10px; max-width: 22ch; font-weight: 600;
    }
    .lead { font-size: 14px; color: var(--muted); max-width: 58ch; line-height: 1.5; margin: 0 0 22px; }
    .hero-metrics {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px;
    }
    .metric {
      background: #faf8f5; border: 1px solid var(--line); border-radius: 14px; padding: 14px;
    }
    .metric.accent { background: var(--red-soft); border-color: #f3c4c8; }
    .metric .l { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .metric .v { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }

    .score-banner {
      display: grid; grid-template-columns: 120px 1fr; gap: 14px; align-items: center;
      border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 20px;
      background: #faf8f5;
    }
    .score-banner .big {
      font-size: 34px; font-weight: 700; color: var(--red); line-height: 1;
    }
    .score-banner .big span { font-size: 14px; color: var(--muted); font-weight: 500; }
    .score-banner h3 { margin: 0 0 4px; font-size: 16px; }
    .score-banner p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.4; }

    .sec-h {
      font-family: var(--display); font-size: 20px; margin: 0 0 6px; font-weight: 600;
    }
    .sec-aud {
      font-size: 11px; font-weight: 700; color: var(--red); text-transform: uppercase;
      letter-spacing: 0.05em; margin-bottom: 12px;
    }
    .check-item {
      border: 1px solid var(--line); border-radius: 12px; padding: 12px 12px 12px 14px;
      margin-bottom: 8px; background: #fff;
    }
    .check-item p {
      margin: 0 0 10px; font-size: 13px; line-height: 1.4;
    }
    .check-item .num {
      display: inline-block; width: 22px; height: 22px; border-radius: 50%;
      background: #141414; color: #fff; font-size: 11px; font-weight: 700;
      text-align: center; line-height: 22px; margin-right: 8px; vertical-align: middle;
    }
    .tri {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    .tri button {
      appearance: none; border: 1px solid #d8d4ce; background: #faf8f5;
      border-radius: 10px; min-height: 38px; font: inherit; font-size: 12px;
      font-weight: 600; cursor: pointer; color: var(--ink);
    }
    .tri button.is-on[data-v="yes"] { background: #e8f6ee; border-color: #1a7a4c; color: #1a7a4c; }
    .tri button.is-on[data-v="mid"] { background: #fff6e5; border-color: #c48100; color: #8a5a00; }
    .tri button.is-on[data-v="no"] { background: var(--red-soft); border-color: var(--red); color: var(--red); }

    .section-score {
      font-size: 12px; color: var(--muted); margin: 4px 0 18px; text-align: right;
    }

    .aud-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
    }
    .aud-card {
      border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: #fff;
    }
    .aud-card h4 {
      margin: 0 0 8px; font-size: 12px; color: var(--red);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .aud-card ul {
      margin: 0; padding: 0 0 0 16px; font-size: 12.5px; line-height: 1.45;
    }
    .aud-card li { margin-bottom: 6px; }

    .recs { display: grid; gap: 8px; }
    .rec {
      border-left: 3px solid var(--red); padding: 10px 12px; background: #faf8f5;
      border-radius: 0 12px 12px 0;
    }
    .rec .aud { font-size: 10px; color: var(--red); text-transform: uppercase; letter-spacing: 0.04em; }
    .rec strong { display: block; margin: 2px 0 4px; font-size: 13px; }
    .rec p { margin: 0; font-size: 12.5px; color: #333; line-height: 1.4; }

    .disclaimer {
      margin-top: 20px; font-size: 11px; color: var(--muted); line-height: 1.4;
      border-top: 1px solid var(--line); padding-top: 12px;
    }

    @media (max-width: 960px) {
      .studio { grid-template-columns: 1fr; }
      .panel { position: static; }
      .hero-metrics, .aud-grid { grid-template-columns: 1fr; }
      .page { padding: 24px 18px; }
      .score-banner { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: #fff; }
      .studio { display: block; padding: 0; max-width: none; }
      .panel { display: none !important; }
      .report { border: 0; box-shadow: none; }
      .page { padding: 14mm 12mm; break-after: page; border: 0; }
      .page:last-child { break-after: auto; }
      .tri button:not(.is-on) { display: none; }
      .tri { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <aside class="panel">
      <h1>Отчёт + чек-лист</h1>
      <p class="hint">Калькулятор остаётся коротким. Здесь — кликабельный чек-лист из 20 пунктов (как в PDF «проверка ИТ-инфраструктуры»). Ответы сразу собирают рекомендации.</p>

      <label for="company">Компания</label>
      <input id="company" type="text" value="Пример для руководства" />

      <label for="endpoints">Рабочие места</label>
      <select id="endpoints">
        <option value="100">до 100</option>
        <option value="300" selected>100–500</option>
        <option value="750">500–1000</option>
        <option value="2500">1000–5000</option>
        <option value="7500">5000+</option>
      </select>

      <label for="itStaff">Сотрудники ИТ</label>
      <input id="itStaff" type="number" min="1" max="500" value="35" />

      <label for="budget">Бюджет на ПО / год, ₽</label>
      <input id="budget" type="text" inputmode="numeric" value="12 000 000" />

      <div class="row-btns">
        <button type="button" class="btn btn-primary" id="btnPrint">Скачать PDF</button>
        <button type="button" class="btn btn-ghost" id="btnReset">Сбросить чек-лист</button>
      </div>
      <p class="hint" style="margin-top:12px;margin-bottom:0">Калькулятор без квиза: <a href="../calc-preview.html">calc-preview</a></p>
    </aside>

    <div class="report-wrap">
      <article class="report" id="report"></article>
    </div>
  </div>

  <script src="./report-engine.js"></script>
  <script src="./checklist-data.js"></script>
  <script>
    (function () {
      var answers = {};
      try {
        answers = JSON.parse(localStorage.getItem("itmen_roi_checklist") || "{}") || {};
      } catch (e) {
        answers = {};
      }

      function parseBudget(raw) {
        var n = Number(String(raw || "").replace(/\D/g, ""));
        return isFinite(n) ? n : 0;
      }

      function readScale() {
        return {
          company: document.getElementById("company").value.trim(),
          endpoints: Number(document.getElementById("endpoints").value || 0),
          itStaff: Number(document.getElementById("itStaff").value || 0),
          budget: parseBudget(document.getElementById("budget").value),
        };
      }

      function saveAnswers() {
        try {
          localStorage.setItem("itmen_roi_checklist", JSON.stringify(answers));
        } catch (e) {}
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function applyQs() {
        var p = new URLSearchParams(location.search);
        if (p.get("company")) document.getElementById("company").value = p.get("company");
        if (p.get("wp") || p.get("endpoints"))
          document.getElementById("endpoints").value = p.get("wp") || p.get("endpoints");
        if (p.get("it") || p.get("itStaff"))
          document.getElementById("itStaff").value = p.get("it") || p.get("itStaff");
        if (p.get("budget")) {
          var b = parseBudget(p.get("budget"));
          document.getElementById("budget").value = b
            ? b.toLocaleString("ru-RU").replace(/\u00a0/g, " ")
            : p.get("budget");
        }
      }

      function render() {
        var scale = readScale();
        var calc = ItmenRoiReport.calculate({
          endpoints: scale.endpoints,
          itStaff: scale.itStaff,
          budget: scale.budget,
          quiz: {},
        });
        var scored = ItmenChecklist.scoreAnswers(answers);
        var narrative = ItmenChecklist.buildChecklistNarrative(scored, calc.fmt);
        var f = calc.fmt;
        var company = scale.company || "вашей компании";
        var when = new Date().toLocaleDateString("ru-RU", {
          day: "numeric",
          month: "long",
          year: "numeric",
        });

        var html = "";
        html += '<section class="page">';
        html += '<div class="brand-row"><div class="brand">Инферит <span>ИТМен</span></div>';
        html += '<div class="meta">Персональный отчёт<br>' + when + "<br>Конфиденциально</div></div>";
        html += '<div class="kicker">ROI + самопроверка</div>';
        html += "<h2 class=\"report-title\">Эффект и контроль инфраструктуры для " + escapeHtml(company) + "</h2>";
        html += '<p class="lead">Сверху — ориентир экономии по масштабу парка. Ниже — кликабельный чек-лист (20 пунктов из материалов ИТМен): отметьте Да / Средне / Нет — и получите рекомендации под ваши ответы.</p>';
        html += '<div class="hero-metrics">';
        html += '<div class="metric accent"><div class="l">Потенциальная экономия в год</div><div class="v">' + f.save + "</div></div>";
        html += '<div class="metric"><div class="l">ROI (год 1)</div><div class="v">' + f.roi + "</div></div>";
        html += '<div class="metric"><div class="l">Окупаемость</div><div class="v">' + f.pay + "</div></div>";
        html += "</div>";
        html +=
          '<p style="font-size:12px;color:#666;margin:0 0 8px">Вводные: ' +
          calc.inputs.endpoints.toLocaleString("ru-RU") +
          " РМ · " +
          calc.inputs.itStaff +
          " в ИТ · бюджет ПО " +
          f.budget +
          "</p>";
        html += "</section>";

        html += '<section class="page">';
        html += '<div class="kicker">Чек-лист · 20 пунктов</div>';
        html += '<h3 class="sec-h">Под контролем ли ваша ИТ-инфраструктура?</h3>';
        html += '<p class="lead">Механика как в PDF-чек-листе: Да = 2, Средне = 1, Нет = 0. Максимум 40 баллов.</p>';

        html += '<div class="score-banner" id="scoreBanner">';
        html +=
          '<div class="big">' +
          scored.total +
          ' <span>/ ' +
          (scored.max || 40) +
          "</span></div>";
        html +=
          "<div><h3>" +
          escapeHtml(scored.level.title) +
          "</h3><p>" +
          escapeHtml(scored.level.text) +
          (scored.answered < 20
            ? " Отмечено " + scored.answered + " из 20."
            : "") +
          "</p></div></div>";

        var n = 0;
        ItmenChecklist.SECTIONS.forEach(function (sec) {
          var secScore = scored.bySection[sec.id] || { score: 0, max: 10 };
          html += '<div class="sec-aud">' + escapeHtml(sec.audience) + "</div>";
          html += '<h3 class="sec-h" style="font-size:18px">' + escapeHtml(sec.title) + "</h3>";
          sec.items.forEach(function (item) {
            n += 1;
            var cur = answers[item.id] || "";
            html += '<div class="check-item" data-id="' + item.id + '">';
            html +=
              "<p><span class=\"num\">" +
              n +
              "</span>" +
              escapeHtml(item.text) +
              "</p>";
            html += '<div class="tri" role="group" aria-label="Оценка">';
            ["yes", "mid", "no"].forEach(function (v) {
              var label = v === "yes" ? "Да (2)" : v === "mid" ? "Средне (1)" : "Нет (0)";
              html +=
                '<button type="button" data-id="' +
                item.id +
                '" data-v="' +
                v +
                '"' +
                (cur === v ? ' class="is-on"' : "") +
                ">" +
                label +
                "</button>";
            });
            html += "</div></div>";
          });
          html +=
            '<p class="section-score">Итого по разделу: <strong>' +
            secScore.score +
            " / " +
            secScore.max +
            "</strong></p>";
        });
        html += "</section>";

        html += '<section class="page">';
        html += '<div class="kicker">По вашим ответам</div>';
        html += '<h3 class="sec-h">Рекомендации и аргументы</h3>';
        html += '<p class="lead">Собрано из пунктов, где вы отметили «Нет» или «Средне» — отдельно для финансов, ИБ и руководства.</p>';
        html += '<div class="aud-grid">';
        html +=
          '<div class="aud-card"><h4>Финансы</h4><ul>' +
          narrative.forFinance
            .map(function (t) {
              return "<li>" + escapeHtml(t) + "</li>";
            })
            .join("") +
          "</ul></div>";
        html +=
          '<div class="aud-card"><h4>ИБ</h4><ul>' +
          narrative.forSecurity
            .map(function (t) {
              return "<li>" + escapeHtml(t) + "</li>";
            })
            .join("") +
          "</ul></div>";
        html +=
          '<div class="aud-card"><h4>Руководство</h4><ul>' +
          narrative.forExec
            .map(function (t) {
              return "<li>" + escapeHtml(t) + "</li>";
            })
            .join("") +
          "</ul></div>";
        html += "</div>";

        if (narrative.recommendations.length) {
          html += '<h3 class="sec-h" style="margin-top:22px;font-size:18px">Приоритеты</h3>';
          html += '<div class="recs">';
          narrative.recommendations.forEach(function (r) {
            html +=
              '<div class="rec"><span class="aud">' +
              escapeHtml(r.audience) +
              "</span><strong>" +
              escapeHtml(r.title) +
              "</strong><p>" +
              escapeHtml(r.text) +
              (r.itil
                ? " <em style=\"color:#888\">ITIL: " + escapeHtml(r.itil) + "</em>"
                : "") +
              "</p></div>";
          });
          html += "</div>";
        } else {
          html +=
            '<p class="lead" style="margin-top:16px">Отметьте пункты чек-листа — здесь появятся приоритетные рекомендации.</p>';
        }

        html +=
          '<p class="disclaimer">Чек-лист адаптирован из материала «Бесплатный чек-лист для проверки ИТ-инфраструктуры» (Инферит ИТМен). Цифры экономии — ориентир по масштабу парка, не оферта. Фактический эффект зависит от периметра пилота.</p>';
        html += "</section>";

        document.getElementById("report").innerHTML = html;
      }

      document.getElementById("report").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-id][data-v]");
        if (!btn) return;
        answers[btn.getAttribute("data-id")] = btn.getAttribute("data-v");
        saveAnswers();
        render();
      });

      ["company", "endpoints", "itStaff", "budget"].forEach(function (id) {
        document.getElementById(id).addEventListener("input", render);
        document.getElementById(id).addEventListener("change", render);
      });
      document.getElementById("btnPrint").addEventListener("click", function () {
        window.print();
      });
      document.getElementById("btnReset").addEventListener("click", function () {
        answers = {};
        saveAnswers();
        render();
      });

      applyQs();
      render();
    })();
  </script>
</body>
</html>
